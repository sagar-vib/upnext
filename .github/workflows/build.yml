name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  no-swiftui-macros:
    name: No SwiftUI macros
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check sources
        run: |
          # In the macOS 27 SDK, @State and friends are macros whose plugin ships only with Xcode,
          # so they break Command Line Tools builds. Use State(initialValue:) as a stored property.
          if grep -rnE '^[^/]*(@(State|Entry|Previewable)|#Preview)([^A-Za-z]|$)' Sources; then
            echo "::error::SwiftUI macros break Command Line Tools builds on the macOS 27 SDK. Use State(initialValue:) as a stored property instead of @State."
            exit 1
          fi

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 15, Xcode 16
            runner: macos-15
            toolchain: xcode
          - name: macOS 26, newest Xcode
            runner: macos-26
            toolchain: newest-xcode
          - name: macOS 26, newest Command Line Tools
            runner: macos-26
            toolchain: clt
    steps:
      - uses: actions/checkout@v5

      - name: Use newest Command Line Tools only
        if: matrix.toolchain == 'clt'
        run: |
          # Makes softwareupdate offer the Command Line Tools, as Homebrew's installer does.
          sudo touch /tmp/.com.apple.dt.CommandLineTools.installondemand.in-progress
          label=$(softwareupdate --list 2>&1 | grep -E '^[[:space:]]*\* Label: Command Line Tools' | sed -E 's/^[[:space:]]*\* Label: //' | sort -V | tail -1)
          if [[ -n "$label" ]]; then
            echo "Installing $label"
            sudo softwareupdate --install "$label" --agree-to-license
          else
            echo "No newer Command Line Tools offered; using the preinstalled ones."
          fi
          sudo rm -f /tmp/.com.apple.dt.CommandLineTools.installondemand.in-progress
          sudo xcode-select -s /Library/Developer/CommandLineTools
          ls /Library/Developer/CommandLineTools/usr/lib/swift/host/plugins

      - name: Use newest Xcode
        if: matrix.toolchain == 'newest-xcode'
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Toolchain
        run: |
          xcrun --show-sdk-version
          xcode-select -p
          swift --version

      - name: Lint property lists
        run: plutil -lint Resources/Info.plist Resources/UpnextWidget-Info.plist Resources/UpnextWidget.entitlements

      - name: Build Upnext.app
        run: |
          set -o pipefail
          ./build.sh --build-only 2>&1 | tee build.log

      - name: Report compiler diagnostics
        if: always()
        run: |
          pattern='\.swift:[0-9]+:[0-9]+: (error|warning):'
          if [[ -f build.log ]] && grep -Eq "$pattern" build.log; then
            grep -E "$pattern" build.log | sort -u | tee diagnostics.txt
            sed -E 's#^.*/(Sources/[^:]+):([0-9]+):([0-9]+): (error|warning): (.*)$#::\4 file=\1,line=\2,col=\3::\5#' diagnostics.txt
            { echo '```'; cat diagnostics.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No compiler errors or warnings."
          fi

      - name: Verify bundle
        run: |
          codesign --verify --deep --strict --verbose=2 build/Upnext.app
          plutil -p build/Upnext.app/Contents/Info.plist
          plutil -p build/Upnext.app/Contents/PlugIns/UpnextWidget.appex/Contents/Info.plist
          echo "Widget entitlements:"
          codesign -d --entitlements - build/Upnext.app/Contents/PlugIns/UpnextWidget.appex
          bin=build/Upnext.app/Contents/PlugIns/UpnextWidget.appex/Contents/MacOS/UpnextWidget
          if ! nm -u "$bin" | grep -qx _NSExtensionMain; then
            echo "::error::The widget doesn't start in NSExtensionMain, so WidgetKit can't load it"
            exit 1
          fi
          echo "Widget starts in NSExtensionMain."

      - name: Register the desktop widget
        run: |
          # The same check macOS makes before listing the widget in the gallery.
          pluginkit -a build/Upnext.app/Contents/PlugIns/UpnextWidget.appex
          sleep 3
          pluginkit -m -v -p com.apple.widgetkit-extension | tee plugins.txt
          if ! grep -q com.sidd.upnext.widget plugins.txt; then
            echo "::error::macOS didn't register the Upnext widget extension"
            exit 1
          fi

      - name: Launch for 10 seconds
        run: |
          build/Upnext.app/Contents/MacOS/Upnext > launch.log 2>&1 &
          pid=$!
          sleep 10
          if kill -0 "$pid" 2>/dev/null; then
            echo "Upnext is still running after 10 seconds. Its output:"
            kill "$pid"
            cat launch.log
          else
            status=0
            wait "$pid" || status=$?
            cat launch.log
            echo "::error::Upnext exited during launch with status $status"
            exit 1
          fi

      - name: Check the widget snapshot
        run: |
          file="$HOME/Library/Application Support/Upnext/Widget.json"
          if [[ ! -s "$file" ]]; then
            echo "::error::Upnext didn't write the widget snapshot to $file"
            exit 1
          fi
          python3 -m json.tool "$file" | head -40
